# cargo-deny configuration — license compliance gate for Cruft (BSL 1.1).
#
# Purpose: keep the dependency tree PERMISSIVE-ONLY so the runtime can be
# distributed under the Business Source License 1.1 + commercial terms
# (see LICENSE / COMMERCIAL-LICENSE.md). Copyleft (GPL/AGPL/LGPL/MPL/SSPL/...)
# is NOT in the allow-list, so it is denied by default — a `cargo add` that
# pulls in a copyleft crate fails this gate.
#
# Run:  cargo deny check licenses      (or: cargo deny check)
# Install: cargo install cargo-deny --locked

[graph]

all-features = false

[licenses]

version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MIT-0",
    "BSL-1.0",
    "LicenseRef-BSL-1.1",
]

exceptions = []

[bans]

multiple-versions = "warn"
wildcards = "warn"

[advisories]

version = 2
yanked = "warn"

[sources]

unknown-registry = "deny"
unknown-git = "warn"
